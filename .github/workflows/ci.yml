name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-and-test:
    name: Check, Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all --check

      - name: Workspace Check
        run: cargo check --workspace

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace

      - name: Set up Python for SDK Verification
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify Python SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/python
          python -m unittest discover -s sdk/python/tests
          python tests/test_python_sdk.py

      - name: Set up Node.js for SDK Verification
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify TypeScript SDK
        run: |
          npx -y -p typescript tsc -p sdk/typescript/tsconfig.json
          node --test sdk/typescript/test/*.test.mjs

      - name: Verify Quickstart TypeScript Types
        run: npx -y -p typescript tsc -p examples/quickstart_typescript/tsconfig.json --noEmit

      - name: Run Multi-Domain E2E Test Suites & Quickstarts
        run: |
          chmod +x scripts/run_e2e_tests.sh
          ./scripts/run_e2e_tests.sh

      - name: Run High-Concurrency Benchmark
        run: |
          chmod +x scripts/benchmark.sh
          ./scripts/benchmark.sh

  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: check-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: obaf-server:test
