name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Check, Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all --check

      - name: Workspace Check
        run: cargo check --workspace

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace

      - name: Set up Python for SDK Verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/python
          python tests/test_python_sdk.py

      - name: Set up Node.js for SDK Verification
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify TypeScript SDK
        run: |
          npx -y -p typescript tsc -p sdk/typescript/tsconfig.json --noEmit

  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: check-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: obaf-server:test
