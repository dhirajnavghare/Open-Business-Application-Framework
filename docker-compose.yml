services:
  # Standalone OBAF Server with zero-dependency SQLite
  obaf-sqlite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obaf-server
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///app/data/obaf.db?mode=rwc
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-admin@obaf.local}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-admin123}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # High-Concurrency Profile: OBAF Server with PostgreSQL
  obaf-postgres:
    profiles: ["postgres"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obaf-server-pg
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://obaf:obaf_secret@postgres:5432/obaf_db
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-admin@obaf.local}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:17-alpine
    container_name: obaf-postgres
    environment:
      POSTGRES_DB: obaf_db
      POSTGRES_USER: obaf
      POSTGRES_PASSWORD: obaf_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obaf -d obaf_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Background Worker & Scheduler Daemon
  obaf-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obaf-worker
    entrypoint: ["docker-entrypoint.sh", "/app/obaf-worker"]
    environment:
      - DATABASE_URL=sqlite:///app/data/obaf.db?mode=rwc
      - OBAF_WORKER_INTERVAL_SECS=30
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Automated TLS Reverse Proxy Gateway (for Single-Server Production Deployments)
  caddy:
    profiles: ["gateway", "production"]
    image: caddy:2-alpine
    container_name: obaf-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - obaf-sqlite
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
