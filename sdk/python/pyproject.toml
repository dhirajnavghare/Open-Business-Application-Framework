[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obaf-sdk"
version = "0.1.0"
description = "Official Python SDK for Open Business Application Framework (OBAF)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhiraj Navghare", email = "dhirajnavghare@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
keywords = ["obaf", "business", "pos", "billing", "erp", "headless"]
dependencies = []
