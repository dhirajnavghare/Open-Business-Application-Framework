[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obaf-sdk"
version = "0.1.0"
description = "Official Python SDK for Open Business Application Framework (OBAF)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "OBAF Contributors" }]
keywords = ["obaf", "business", "pos", "billing", "erp", "headless"]
dependencies = [
    "requests>=2.28.0",
]
